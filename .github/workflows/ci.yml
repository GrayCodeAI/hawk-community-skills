name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tools/requirements.txt pytest pytest-cov
      - name: Validate all skills
        run: python3 tools/validate_skill.py --all
      - name: Run tests
        run: python -m pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=30
