name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tools/requirements.txt pytest pytest-cov pip-audit ruff
      - name: Lint (Makefile lint target)
        # Wire the repo Makefile lint target into CI: ruff check over tools/.
        run: make lint
      - name: Compile category payload scripts
        # Syntax-check shipped skill scripts so a SyntaxError in
        # categories/**/scripts/*.py fails the build (they are never imported
        # by the test suite).
        run: python3 -m compileall -q categories
      - name: Validate all skills
        run: python3 tools/validate_skill.py --all
      - name: Run tests
        run: python -m pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=88
      - name: Security audit
        run: pip-audit -r tools/requirements.txt

  # -------------------------------------------------------------------------
  # Duplication detection — jscpd.
  # -------------------------------------------------------------------------
  jscpd:
    name: duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: jscpd
        run: |
          npx jscpd --min-lines 8 --min-tokens 100 --threshold 20 --reporters console \
            --ignore "categories/**,docs/**,plans/**" . 2>&1 | tail -30
