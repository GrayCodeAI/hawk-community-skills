name: Validate Skills

on:
  pull_request:
    paths: ['categories/**', '.claude-plugin/**', '.codex-plugin/**', '.cursor-plugin/**', 'VERSION', 'tools/**']
  push:
    branches: [main]
    paths: ['categories/**', 'VERSION', 'tools/**', '.github/workflows/validate-skills.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r tools/requirements.txt
      - name: Frontmatter validation
        run: python3 tools/validate_skill.py --all
      - name: Version sync check
        run: python3 tools/check_version_sync.py
      - name: Reference integrity
        run: python3 tools/check_references.py
      - name: Self-containment check
        run: python3 tools/check_self_contained.py
      - name: Secret scan (warning-only)
        # Warning mode for now: the security/code-review skills contain
        # token-shaped example strings. Switch to --strict once the corpus is
        # confirmed clean so a real leaked credential fails the build.
        run: python3 tools/check_secrets.py
      - name: License compatibility gate
        # Strict: copyleft (GPL/LGPL/AGPL) content must not be vendored into the
        # MIT-rooted repo. See NOTICE for the policy.
        run: python3 tools/check_licenses.py
